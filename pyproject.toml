[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sde-value"
version = "0.3.0"
description = "Seller's discretionary earnings workbook that tests add-backs and reprices owner pay at BLS market wages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sde-value = "sde_value.cli:main"

[tool.setuptools]
packages = ["sde_value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
