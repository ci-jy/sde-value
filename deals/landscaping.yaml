  - item: Equipment rental for hurricane cleanup
    line: other_deductions
    label: one-time
    amount: 18000
    support: Rental agreements
    years_seen: 1
  - item: Boat and fishing trips
    line: other_deductions
    label: discretionary
    amount: 11000
    support: none provided
    documented: false
    years_seen: 3
